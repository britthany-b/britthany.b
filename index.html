<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Britthany | Gatos, libros y lápiz </title>
    <!-- Script necesario para Decap CMS Identity -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <style>
        :root {
            --bg-color: #FFF0F3;
            --card-bg: #FFFDF9;
            --text-main: #3D2314;
            --text-sub: #7A5853;
            --gold-accent: #D4AF37;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Times New Roman', Times, serif;
            margin: 0;
            padding: 0;
            line-height: 1.7;
        }

        header {
            text-align: center;
            padding: 60px 20px 30px;
        }

        h1.site-title {
            font-size: 3rem;
            margin: 0;
            letter-spacing: 2px;
            font-weight: normal;
        }

        .gold-divider {
            width: 80px;
            height: 2px;
            background-color: var(--gold-accent);
            margin: 15px auto;
        }

        p.subtitle {
            font-style: italic;
            color: var(--text-sub);
            font-size: 1.1rem;
            margin: 0;
        }

        main {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .post-card {
            background-color: var(--card-bg);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 8px;
            padding: 30px;
            margin-bottom: 40px;
            box-shadow: 0 4px 15px rgba(61, 35, 20, 0.03);
        }

        .post-date {
            font-size: 0.85rem;
            color: var(--gold-accent);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .post-title {
            font-size: 2rem;
            margin: 10px 0;
        }

        footer {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-sub);
            font-size: 0.9rem;
            border-top: 1px solid rgba(212, 175, 55, 0.2);
        }
        <head>
  <meta charset="UTF-8">
  <title>Mi Sitio Web</title>

  <!-- Pega los estilos aquí dentro -->
  <style>
    /* Cuadrícula estilo periódico */
    .grid-periodico {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 25px;
      margin-top: 20px;
    }

    .noticia-card {
      background: #ffffff;
      border-bottom: 2px solid #e2e2e2;
      padding-bottom: 15px;
    }

    .noticia-card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 4px;
      margin-bottom: 10px;
    }

    .noticia-card small {
      color: #888;
      font-size: 0.8rem;
      text-transform: uppercase;
    }

    .noticia-card h3 {
      margin: 6px 0;
      font-size: 1.25rem;
    }

    .noticia-card h3 a {
      color: #111;
      text-decoration: none;
    }

    .noticia-card h3 a:hover {
      text-decoration: underline;
    }

    .noticia-card p {
      color: #555;
      font-size: 0.95rem;
      line-height: 1.4;
    }

    .leer-mas {
      display: inline-block;
      margin-top: 8px;
      font-weight: bold;
      color: #000;
      text-decoration: none;
    }

    /* Botón Cargar Más */
    .boton-contenedor {
      text-align: center;
      margin-top: 30px;
    }

    #btn-cargar-mas {
      background-color: #222;
      color: #fff;
      border: none;
      padding: 12px 24px;
      font-size: 0.95rem;
      border-radius: 25px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    #btn-cargar-mas:hover {
      background-color: #444;
    }
  </style>
</head>
    </style>
</head>
<body>

    <header>
        <h1 class="site-title">Britthany</h1>
        <div class="gold-divider"></div>
        <p class="subtitle">A veces reseñas literarias, otras veces solo yo</p>
    </header>

    <main>
        <article class="post-card">
            <span class="post-date">7 de Octubre, 2026</span>
            <h2 class="post-title">¡Bienvenid@s!</h2>
            <p>Sitio web oficial de una completa desconocida.</p>
        </article>
    </main>
    
<section class="seccion-periodico">
  <h2>Últimas Publicaciones</h2>
  
  <div id="contenedor-entradas" class="grid-periodico"></div>
  
  <!-- Botón para cargar más -->
  <div class="boton-contenedor">
    <button id="btn-cargar-mas" onclick="cargarMasEntradas()">Cargar más entradas</button>
  </div>
</section>
    
    <footer>
        <p>&copy; Britthany B. Todos los derechos reservados.</p>
    </footer>

    <script>
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on("init", user => {
          if (!user) {
            window.netlifyIdentity.on("login", () => {
              document.location.href = "/admin/";
            });
          }
        });
      }
    </script>
    
</body>
</html>
