        body {

        .glass-card {

        .pixelated {

        /* Floating Pixel Pet Container */
        #pixel-pet-container {
            position: fixed;
            pointer-events: auto;
            z-index: 9999;
            top: 0;
            left: 0;
            transition: transform 0.1s linear;
        }

        .speech-bubble {
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            background: #FFF;
            border: 2px solid #5C4033;
            padding: 2px 8px;
            font-size: 11px;
            font-family: monospace;
            border-radius: 8px;
            white-space: nowrap;
            box-shadow: 2px 2px 0px #5C4033;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .speech-bubble.show {
            opacity: 1;
        }

        /* Floating Hearts Animation */
        .heart-particle {
            position: fixed;
            pointer-events: none;
            z-index: 10000;
            font-size: 18px;
            user-select: none;
            animation: floatUpAndFade 1.2s ease-out forwards;
        }

        @keyframes floatUpAndFade {
            0% {
                opacity: 1;
                transform: translate(-50%, 0) scale(0.6) rotate(0deg);
            }
            50% {
                transform: translate(calc(-50% + (var(--rand-x) * 20px)), -35px) scale(1.2) rotate(calc(var(--rand-x) * 15deg));
            }
            100% {
                opacity: 0;
                transform: translate(calc(-50% + (var(--rand-x) * 40px)), -70px) scale(0.8) rotate(calc(var(--rand-x) * 30deg));
            }
        }

<script>
    const NOTION_MUSIC_URL = "https://potion-api.vercel.app/table?id=3f55acb16f7480268299e4e03f2c1efd";

    async function fetchNotionMusic() {
        const container = document.getElementById('playlist-container');
        const statusIndicator = document.getElementById('music-status');

        try {
            const response = await fetch(https://app.notion.com/p/M-sica-3f55acb16f7480268299e4e03f2c1efd?source=copy_link);
            if (!response.ok) throw new Error("Error leyendo Notion Música");
            const data = await response.json();

            if (data && data.length > 0) {
                renderPlaylist(data);
                statusIndicator.innerText = "Playlist🎶";
            } else {
                renderEmptyMusicState();
            }
        } catch (error) {
            renderEmptyMusicState();
        }
    }

    function renderPlaylist(songs) {
        const container = document.getElementById('playlist-container');
        container.innerHTML = songs.map((song, index) => {
            const title = song.Cancion || song.Canción || song.Name || 'Canción sin título';
            const artist = song.Artista || 'Artista';
            const audioUrl = song.AudioURL || song.LinkMP3 || song.Link || '';
            
            return `
                <div class="bg-cream/60 hover:bg-cream p-3 rounded-xl border border-softPink/50 flex items-center justify-between transition cursor-pointer" 
                     onclick="loadSong('${escapeHtml(title)}', '${escapeHtml(artist)}', '${escapeHtml(audioUrl)}')">
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 rounded-full bg-softPink text-warmBrown flex items-center justify-center text-xs font-bold">${index + 1}</div>
                        <div>
                            <h5 class="font-bold text-warmBrown text-base">${title}</h5>
                            <p class="text-xs text-lightBrown italic">${artist}</p>
                        </div>
                    </div>
                    <i class="fa-solid fa-play text-xs text-lightBrown"></i>
                </div>
            `;
        }).join('');
    }

    function renderEmptyMusicState() {
        const container = document.getElementById('playlist-container');
        container.innerHTML = `
            <div class="p-4 text-center text-sm text-lightBrown italic bg-cream/40 rounded-xl">
              🎧
            </div>
        `;
    }

    function escapeHtml(text) {
        return (text || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
    }

    const audio = document.getElementById('audio-player');
    const playBtn = document.getElementById('play-btn');
    const playIcon = document.getElementById('play-icon');
    const currentTitle = document.getElementById('current-title');
    const currentArtist = document.getElementById('current-artist');
    const seekBar = document.getElementById('seek-bar');
    const volumeBar = document.getElementById('volume-bar');
    const currentTimeEl = document.getElementById('current-time');
    const totalDurationEl = document.getElementById('total-duration');
    let isPlaying = false;

    function loadSong(title, artist, src) {
        currentTitle.innerText = title;
        currentArtist.innerText = artist;
        if (src) {
            audio.src = src;
            audio.play();
            isPlaying = true;
            updatePlayIcon();
        } else {
            alert
        }
    }

    function togglePlay() {
        if (!audio.src) return;
        if (isPlaying) {
            audio.pause();
        } else {
            audio.play();
        }
        isPlaying = !isPlaying;
        updatePlayIcon();
    }

    function updatePlayIcon() {
        playIcon.className = isPlaying ? "fa-solid fa-pause text-lg" : "fa-solid fa-play text-lg";
    }

    audio.addEventListener('timeupdate', () => {
        if (audio.duration) {
            const progress = (audio.currentTime / audio.duration) * 100;
            seekBar.value = progress;
            currentTimeEl.innerText = formatTime(audio.currentTime);
            totalDurationEl.innerText = formatTime(audio.duration);
        }
    });

    seekBar.addEventListener('input', () => {
        if (audio.duration) {
            audio.currentTime = (seekBar.value / 100) * audio.duration;
        }
    });

    volumeBar.addEventListener('input', () => {
        audio.volume = volumeBar.value / 100;
    });

    function formatTime(seconds) {
        const min = Math.floor(seconds / 60);
        const sec = Math.floor(seconds % 60);
        return `${min}:${sec < 10 ? '0' : ''}${sec}`;
    }

    // Inicializar música
    fetchNotionMusic();
</script>

            sleep: `
                <rect x="4" y="12" width="20" height="12" rx="4" fill="#F59E0B"/>
                <rect x="6" y="10" width="16" height="14" fill="#FBBF24"/>
                <rect x="8" y="12" width="2" height="8" fill="#D97706"/>
                <rect x="12" y="11" width="2" height="9" fill="#D97706"/>
                <rect x="16" y="12" width="2" height="8" fill="#D97706"/>
                <rect x="17" y="8" width="3" height="3" fill="#F59E0B"/>
                <rect x="21" y="9" width="3" height="3" fill="#F59E0B"/>
                <rect x="17" y="15" width="2" height="1" fill="#5C4033"/>
                <rect x="21" y="15" width="2" height="1" fill="#5C4033"/>
                <rect x="3" y="16" width="3" height="8" fill="#D97706"/>
                <rect x="5" y="22" width="12" height="2" fill="#D97706"/>
                <text x="24" y="8" fill="#5C4033" font-size="6" font-family="monospace" font-weight="bold">z</text>
                <text x="27" y="5" fill="#5C4033" font-size="5" font-family="monospace" font-weight="bold">Z</text>
            `
        };

        let catX = window.innerWidth / 2;
        let catY = window.innerHeight / 2;
        let mouseX = catX;
        let mouseY = catY;
        let currentState = 'sit';
        let walkFrame = 0;
        let idleTimer = 0;
        let isFlipped = false;

        petContainer.style.transform = `translate(${catX}px, ${catY}px)`;
        catSvg.innerHTML = PIXEL_FRAMES.sit;

        window.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
            wakeUpCat();
        });

        window.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) {
                mouseX = e.touches[0].clientX;
                mouseY = e.touches[0].clientY;
                wakeUpCat();
            }
        });

        function wakeUpCat() {
            idleTimer = 0;
            if (currentState === 'sleep') {
                showSpeech('Meow! 🐾');
            }
        }

        function showSpeech(text) {
            petBubble.innerText = text;
            petBubble.classList.add('show');
            setTimeout(() => petBubble.classList.remove('show'), 2000);
        }

        petContainer.addEventListener('click', (e) => {
            e.stopPropagation();
            wakeUpCat();
            showSpeech('Meow! 🐾');
            spawnHearts(e.clientX, e.clientY);
        });

        function spawnHearts(originX, originY) {
            const heartIcons = ['💖', '🌸', '✨', '💕', '💗'];
            for (let i = 0; i < 6; i++) {
                const heart = document.createElement('div');
                heart.className = 'heart-particle';
                heart.innerText = heartIcons[Math.floor(Math.random() * heartIcons.length)];
                heart.style.left = `${originX + (Math.random() * 20 - 10)}px`;
                heart.style.top = `${originY + (Math.random() * 20 - 10)}px`;
                heart.style.setProperty('--rand-x', (Math.random() - 0.5) * 2);
                document.body.appendChild(heart);
                setTimeout(() => heart.remove(), 1200);
            }
        }

        setInterval(() => {
            const dx = mouseX - (catX + 32);
            const dy = mouseY - (catY + 32);
            const distance = Math.sqrt(dx * dx + dy * dy);

            if (distance > 45) {
                currentState = 'walk';
                idleTimer = 0;
                const speed = Math.min(distance * 0.08, 5);
                catX += (dx / distance) * speed;
                catY += (dy / distance) * speed;

                if (dx < 0) isFlipped = true;
                else if (dx > 0) isFlipped = false;

                walkFrame = (walkFrame + 1) % 2;
                catSvg.innerHTML = walkFrame === 0 ? PIXEL_FRAMES.walk1 : PIXEL_FRAMES.walk2;
            } else {
                idleTimer++;
                if (idleTimer > 80) {
                    if (currentState !== 'sleep') {
                        currentState = 'sleep';
                        showSpeech('Zzz... 😴');
                    }
                    catSvg.innerHTML = PIXEL_FRAMES.sleep;
                } else {
                    if (currentState !== 'sit' && currentState !== 'sleep') {
                        currentState = 'sit';
                    }
                    if (currentState === 'sit') {
                        catSvg.innerHTML = PIXEL_FRAMES.sit;
                    }
                }
            }

            const flipTransform = isFlipped ? 'scaleX(-1)' : 'scaleX(1)';
            petContainer.style.transform = `translate(${catX}px, ${catY}px)`;
            catSvg.style.transform = flipTransform;
        }, 100);

        window.addEventListener('load', () => {
            loadBlogPosts();
            loadSong(0);
            setTimeout(() => showSpeech('Meow! 🐾'), 1000);
        });
    </script>
</body>
</html>
